name: Build APK

on:
  workflow_dispatch:

env:
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK_VERSION: '29.0.14206865'
  VCPKG_ROOT: /usr/local/share/vcpkg
  VCPKG_TRIPLET: arm64-android

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read

    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Update submodules
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4 --recommend-shallow \
            || git submodule update --init --recursive --jobs 4

      - name: Restore vcpkg cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/installed
            ~/.cache/vcpkg/archives
          key: build-vcpkg-${{ env.VCPKG_TRIPLET }}-v2-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            build-vcpkg-${{ env.VCPKG_TRIPLET }}-v2-

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: build-ccache
          max-size: 2G
          verbose: 1

      - name: Install SDK packages
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          packages=()
          [ -d "${sdk_root}/platforms/android-${ANDROID_API_LEVEL}" ] \
            || packages+=("platforms;android-${ANDROID_API_LEVEL}")
          [ -d "${sdk_root}/build-tools/${ANDROID_BUILD_TOOLS}" ] \
            || packages+=("build-tools;${ANDROID_BUILD_TOOLS}")
          [ -d "${sdk_root}/ndk/${ANDROID_NDK_VERSION}" ] \
            || packages+=("ndk;${ANDROID_NDK_VERSION}")
          if [ ${#packages[@]} -ne 0 ]; then
            echo "Installing: ${packages[*]}"
            set +o pipefail
            yes | sdkmanager --licenses > /dev/null
            set -o pipefail
            sdkmanager --install "${packages[@]}"
          else
            echo "All SDK packages are already present."
          fi
          echo "ANDROID_NDK_HOME=${sdk_root}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install vcpkg dependencies
        run: |
          set -euo pipefail
          if ! command -v ninja > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
          vcpkg install --triplet "$VCPKG_TRIPLET"

      - name: Stage assets
        run: |
          set -euo pipefail
          mkdir -p android/app/assets
          rm -rf android/app/assets/data android/app/assets/shaders-builtin
          cp -r data android/app/assets/data
          cp -r vita3k/shaders-builtin android/app/assets/shaders-builtin

      - name: Generate debug keystore
        run: |
          set -euo pipefail
          keystore_dir="$HOME/.android"
          keystore_file="$keystore_dir/debug.keystore"
          mkdir -p "$keystore_dir"
          if [ ! -f "$keystore_file" ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore "$keystore_file" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Configure ccache
        run: |
          set -euo pipefail
          {
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,pch_defines,locale"
            echo "CCACHE_COMPRESS=1"
          } >> "$GITHUB_ENV"
          ccache -z

      - name: Build APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --stacktrace :app:assembleRelease \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Collect APK
        run: |
          set -euo pipefail
          out_dir=android/app/build/outputs/apk/release
          apk="$(find "$out_dir" -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "No APK produced in $out_dir" >&2
            ls -alR "$out_dir" >&2 || true
            exit 1
          fi
          echo "Found $apk"
          mkdir -p artifacts
          cp "$apk" "artifacts/Vita3K-Plus-release.apk"
          (cd artifacts && sha256sum Vita3K-Plus-release.apk > Vita3K-Plus-release.apk.sha256)
          echo "ARTIFACT_NAME=Vita3K-Plus-release" >> "$GITHUB_ENV"
          ls -al artifacts

      - name: Verify APK signature
        run: |
          set -euo pipefail
          build_tools="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          "${build_tools}/apksigner" verify --print-certs artifacts/Vita3K-Plus-release.apk || echo "Signature verification failed, but continuing."

      - name: Show APK info
        run: |
          set -euo pipefail
          aapt="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}" -name aapt2 -print -quit)"
          "$aapt" dump badging artifacts/Vita3K-Plus-release.apk | grep -E "^package|application-label:|native-code" || true

      - name: Print ccache statistics
        if: always()
        run: ccache -s

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30